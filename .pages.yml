# Cấu hình trang quản trị Pages CMS (https://app.pagescms.org) để đăng truyện không cần biết code
media:
  input: public/images
  output: /images

content:
  - name: truyen
    label: Truyện
    type: collection
    path: src/content/truyen
    filename: "{fields.ma}.md"
    view:
      fields: [ten, trangThai, ngayDang]
    fields:
      - { name: ten, label: Tên truyện, type: string, required: true }
      - { name: ma, label: "Mã truyện (viết thường, không dấu, nối bằng gạch ngang, ví dụ: ngoi-nha-cuoi-hem). Đặt một lần, không đổi.", type: string, required: true }
      - { name: tacGia, label: Tác giả (bút danh), type: string }
      - { name: gioiThieu, label: Giới thiệu ngắn, type: text, required: true }
      - { name: anhBia, label: "Ảnh hiển thị của truyện: chọn một hình đã có trong truyện hoặc tải hình mới. Để trống thì web tự lấy hình đầu tiên trong truyện", type: image }
      - name: viTriAnh
        label: Khi ảnh bị cắt cho vừa khung, giữ lại phần nào của ảnh
        type: select
        default: Giữa
        options:
          values: [Giữa, Trên, Dưới]
      - name: theLoai
        label: Thể loại (chọn một hoặc nhiều, có thể gõ thể loại mới)
        type: select
        options:
          multiple: true
          creatable: true
          values: [Ngôn tình, Kinh dị, Linh dị, Tiên hiệp, Kiếm hiệp, Huyền huyễn, Đô thị, Trinh thám, Xuyên không, Cổ đại, Hiện đại, Học đường, Hài hước, Khoa học viễn tưởng, Phiêu lưu, Truyện ngắn]
      - name: trangThai
        label: Trạng thái
        type: select
        default: Đang ra
        options:
          values: [Đang ra, Hoàn thành, Tạm dừng]
      - name: tamTrang
        label: Tâm trạng của truyện (chọn một hoặc nhiều; để trống thì web tự xếp theo thể loại)
        type: select
        options:
          multiple: true
          values: [Muốn cười, Muốn khóc một chút, Muốn hồi hộp, Muốn mơ mộng, Muốn phiêu lưu, Đọc nhanh trước khi ngủ]
      - { name: deCu, label: Đưa lên mục Truyện đề cử ở trang chủ, type: boolean }
      - { name: ngayDang, label: Ngày đăng, type: date, required: true }
      - { name: body, label: Lời giới thiệu thêm (không bắt buộc), type: rich-text }

  - name: chuong
    label: Chương
    type: collection
    path: src/content/chuong
    filename: "{fields.truyen}-chuong-{fields.so}.md"
    view:
      fields: [truyen, so, ten, ngayDang]
    fields:
      - { name: truyen, label: "Mã truyện (giống ô Mã truyện bên mục Truyện)", type: string, required: true }
      - { name: ten, label: Tên chương, type: string, required: true }
      - { name: so, label: Số chương, type: number, required: true }
      - { name: ngayDang, label: Ngày đăng, type: date, required: true }
      - { name: body, label: Nội dung chương, type: rich-text, required: true }
      - { name: loiTacGia, label: Lời tác giả cuối chương (không bắt buộc), type: text }

  - name: cai-dat
    label: Cài đặt web
    type: file
    path: src/data/cai-dat.json
    format: json
    fields:
      - { name: tenWeb, label: Tên web, type: string }
      - { name: khauHieu, label: Khẩu hiệu, type: string }
      - { name: moTa, label: Mô tả (hiện trên Google), type: text }
      - name: ungHo
        label: Nhận ủng hộ
        type: object
        fields:
          - { name: batTat, label: Bật trang ủng hộ, type: boolean }
          - { name: nganHang, label: Tên ngân hàng, type: string }
          - { name: maNganHang, label: "Mã ngân hàng để tự tạo QR (ví dụ: VCB, MB, TCB, ACB, BIDV, VBA)", type: string }
          - { name: soTaiKhoan, label: Số tài khoản, type: string }
          - { name: chuTaiKhoan, label: Tên chủ tài khoản (viết hoa không dấu), type: string }
          - { name: anhQR, label: Hoặc tải ảnh QR có sẵn, type: image }
          - { name: momo, label: Số Momo (không bắt buộc), type: string }
          - { name: loiNhan, label: Lời nhắn, type: text }
      - name: quangCao
        label: Quảng cáo
        type: object
        fields:
          - { name: adsenseId, label: "Mã Google AdSense (dạng ca-pub-xxxxxxxx)", type: string }
      - name: thongKe
        label: Thống kê truy cập (chỉ bạn xem được)
        type: object
        fields:
          - { name: googleAnalytics, label: "Mã Google Analytics (dạng G-XXXXXXXXXX)", type: string }
          - { name: googleSearchConsole, label: Mã xác minh Google Search Console, type: string }
      - name: gocTacGia
        label: Góc tác giả (hiện ở trang chủ, để trống thì ẩn)
        type: object
        fields:
          - { name: butDanh, label: Bút danh, type: string }
          - { name: anhDaiDien, label: Ảnh đại diện (để trống thì dùng hình Bé Sách), type: image }
          - { name: loiChao, label: Lời chào gửi người đọc, type: text }
          - { name: lichRaChuong, label: "Lịch ra chương (ví dụ: Thứ 3, 5, 7 lúc 20h)", type: string }
      - { name: facebook, label: Link trang Facebook, type: string }
